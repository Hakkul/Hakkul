name: GitHub Profile Summary Cards

on:
  schedule:
    # Berjalan otomatis setiap hari pada pukul 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24zfzkq/github-profile-summary-cards@v0.8.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          # Pilihan tema yang cocok dengan profil gelap Anda: 2077, dracula, atau dark
          THEME: 2077
